<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Burden & Electric Cooperative Territories</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
        }
        
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
        
        .info {
            padding: 10px 14px;
            background: white;
            background: rgba(255,255,255,0.95);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 8px;
            max-width: 280px;
        }
        
        .info h4 {
            margin: 0 0 8px;
            color: #333;
            font-size: 16px;
            font-weight: 600;
        }
        
        .info p {
            margin: 6px 0;
            font-size: 13px;
            color: #666;
        }
        
        .info b {
            color: #333;
        }
        
        .legend {
            padding: 14px;
            background: white;
            background: rgba(255,255,255,0.95);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 8px;
            line-height: 20px;
            color: #555;
        }
        
        .legend h4 {
            margin: 0 0 8px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }
        
        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.8;
            border-radius: 2px;
        }
        
        .legend p {
            margin: 4px 0;
            font-size: 12px;
            clear: both;
        }
        
        .legend-divider {
            border-top: 1px solid #ddd;
            margin: 10px 0;
        }
        
        .legend-item {
            margin: 8px 0;
            display: flex;
            align-items: center;
            font-size: 12px;
        }
        
        .legend-coop {
            background: rgba(49, 130, 206, 0.3);
            border: 2px solid #2c5282;
            width: 30px;
            height: 18px;
            margin-right: 8px;
            border-radius: 2px;
        }
        
        .control-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            z-index: 1000;
            min-width: 200px;
        }
        
        .control-panel h4 {
            margin: 0 0 10px 0;
            font-size: 14px;
            font-weight: 600;
        }
        
        .control-panel label {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        
        .control-panel input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
        }
        
        .opacity-control {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e0e0e0;
        }
        
        .opacity-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 4px;
        }
        
        .control-panel input[type="range"] {
            width: 100%;
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 10000;
            text-align: center;
        }
        
        #loading h3 {
            margin: 0 0 15px 0;
            color: #333;
            font-size: 18px;
        }
        
        #loading .progress {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #f0f0f0;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 15px;
        }
        
        .progress-bar-fill {
            height: 100%;
            background: #3498db;
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h3>Loading Map Data</h3>
        <div class="spinner"></div>
        <div class="progress">Initializing...</div>
        <div class="progress-bar">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>
    
    <div id="map"></div>
    
    <!-- Layer Controls -->
    <div class="control-panel">
        <h4>Map Layers</h4>
        <label>
            <input type="checkbox" id="burdenToggle" checked>
            Energy Burden Tracts
        </label>
        <label>
            <input type="checkbox" id="coopToggle" checked>
            Cooperative Territories
        </label>
        
        <div class="opacity-control">
            <div class="opacity-label">
                <span>Tract Opacity</span>
                <span id="burdenOpacityValue">70%</span>
            </div>
            <input type="range" id="burdenOpacity" min="0" max="100" value="70">
        </div>
        
        <div class="opacity-control">
            <div class="opacity-label">
                <span>Coop Opacity</span>
                <span id="coopOpacityValue">25%</span>
            </div>
            <input type="range" id="coopOpacity" min="0" max="100" value="25">
        </div>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map
        const map = L.map('map', {
            center: [39.8283, -98.5795],
            zoom: 5,
            minZoom: 4,
            maxZoom: 13
        });
        
        // Add base map
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);
        
        // Create layer groups
        const burdenLayer = L.layerGroup().addTo(map);
        const coopLayer = L.layerGroup().addTo(map);
        
        // Color scale for energy burden
        function getColor(burden) {
            return burden > 8.0 ? '#a50f15' :
                   burden > 6.0 ? '#de2d26' :
                   burden > 4.5 ? '#fb6a4a' :
                   burden > 3.8 ? '#fc9272' :
                   burden > 3.0 ? '#fcbba1' :
                                  '#fee5d9';
        }
        
        // Style function for census tracts
        function style(feature) {
            return {
                fillColor: getColor(feature.properties.energy_burden),
                weight: 0.5,
                opacity: 0.3,
                color: 'white',
                fillOpacity: 0.7
            };
        }
        
        // Highlight feature on hover
        function highlightFeature(e) {
            const layer = e.target;
            layer.setStyle({
                weight: 2,
                color: '#666',
                fillOpacity: 0.9
            });
            layer.bringToFront();
            info.update(layer.feature.properties);
        }
        
        function resetHighlight(e) {
            burdenGeoJSON.resetStyle(e.target);
            info.update();
        }
        
        // Info control
        const info = L.control();
        
        info.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info');
            this.update();
            return this._div;
        };
        
        info.update = function (props) {
            this._div.innerHTML = '<h4>Household Energy Burden</h4>' +  
                (props ?
                    '<p><b>' + props.state_name + '</b></p>' +
                    '<p>Census Tract: ' + props.GEOID + '</p>' +
                    '<p>Energy Burden: <b>' + props.energy_burden.toFixed(2) + '%</b> of income</p>' +
                    '<p style="font-size:11px;color:#888;margin-top:8px;">Hover over tracts to see details</p>'
                    : '<p>Hover over a census tract</p>');
        };
        
        info.addTo(map);
        
        // Legend
        const legend = L.control({position: 'bottomright'});
        
        legend.onAdd = function (map) {
            const div = L.DomUtil.create('div', 'legend');
            const grades = [0, 3.0, 3.8, 4.5, 6.0, 8.0];
            
            div.innerHTML = '<h4>Energy Burden % of Income</h4>';
            
            for (let i = 0; i < grades.length; i++) {
                div.innerHTML +=
                    '<p><i style="background:' + getColor(grades[i] + 0.1) + '"></i> ' +
                    grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '%' : '+%') + '</p>';
            }
            
            div.innerHTML += '<div class="legend-divider"></div>';
            div.innerHTML += '<div class="legend-item"><i class="legend-coop"></i> Electric Cooperative Territory</div>';
            
            return div;
        };
        
        legend.addTo(map);
        
        // Global reference to burdenGeoJSON for resetStyle
        let burdenGeoJSON;
        
        // Progress tracking
        let loadedFiles = 0;
        const totalFiles = 4; // 3 GeoJSON files + 1 coop territories
        
        function updateProgress(message, percentage) {
            document.querySelector('#loading .progress').textContent = message;
            document.getElementById('progressBar').style.width = percentage + '%';
        }
        
        function fileLoaded() {
            loadedFiles++;
            const percentage = (loadedFiles / totalFiles) * 100;
            
            if (loadedFiles === totalFiles) {
                updateProgress('Complete!', 100);
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                }, 500);
            }
        }
        
        // Load census tract GeoJSON files
        const baseUrl = 'https://raw.githubusercontent.com/salisbrach/Congress-Coop-Map/refs/heads/main/';
        const westUrl = baseUrl + 'energy_burden_tracts_west.geojson';
        const centralUrl = baseUrl + 'energy_burden_tracts_central.geojson';
        const eastUrl = baseUrl + 'energy_burden_tracts_east.geojson';
        
        // Create a single GeoJSON layer to hold all tract data
        burdenGeoJSON = L.geoJSON(null, {
            style: style,
            onEachFeature: function(feature, layer) {
                layer.on({
                    mouseover: highlightFeature,
                    mouseout: resetHighlight
                });
            }
        }).addTo(burdenLayer);
        
        // Load Western US
        updateProgress('Loading Western US tracts...', 0);
        fetch(westUrl)
            .then(response => response.json())
            .then(data => {
                burdenGeoJSON.addData(data);
                updateProgress('Western US loaded', 25);
                fileLoaded();
            })
            .catch(error => {
                console.error('Error loading Western US:', error);
                updateProgress('Error loading Western US', 0);
            });
        
        // Load Central US
        fetch(centralUrl)
            .then(response => response.json())
            .then(data => {
                burdenGeoJSON.addData(data);
                updateProgress('Central US loaded', 50);
                fileLoaded();
            })
            .catch(error => {
                console.error('Error loading Central US:', error);
                updateProgress('Error loading Central US', 25);
            });
        
        // Load Eastern US
        fetch(eastUrl)
            .then(response => response.json())
            .then(data => {
                burdenGeoJSON.addData(data);
                updateProgress('Eastern US loaded', 75);
                fileLoaded();
            })
            .catch(error => {
                console.error('Error loading Eastern US:', error);
                updateProgress('Error loading Eastern US', 50);
            });
        
        // Load cooperative territories
        async function loadCooperativeTerritories() {
            updateProgress('Loading cooperative territories...', 75);
            
            try {
                const hifldUrl = 'https://services5.arcgis.com/ARxOqVFcodl7rmzw/arcgis/rest/services/America_Electrical_Coop_Service_Territories/FeatureServer/10/query';
                
                const params = new URLSearchParams({
                    where: '1=1',
                    outFields: '*',
                    returnGeometry: 'true',
                    f: 'geojson',
                    outSR: '4326'
                });

                const response = await fetch(`${hifldUrl}?${params}`);
                const data = await response.json();

                if (data.features && data.features.length > 0) {
                    L.geoJSON(data.features, {
                        style: feature => ({
                            fillColor: '#3182ce',
                            weight: 1.5,
                            opacity: 0.8,
                            color: '#2c5282',
                            fillOpacity: 0.25
                        }),
                        onEachFeature: (feature, layer) => {
                            const props = feature.properties;
                            layer.bindPopup(`
                                <div style="font-size: 14px;">
                                    <div style="font-weight: 600; color: #2c5282; margin-bottom: 5px;">
                                        ${props.NAME || props.COOP_NAME || 'Unknown Cooperative'}
                                    </div>
                                    <div style="margin: 3px 0; color: #4a5568;">
                                        <strong>Type:</strong> ${props.TYPE || 'Cooperative'}
                                    </div>
                                    ${props.STATE ? `<div style="margin: 3px 0; color: #4a5568;"><strong>State:</strong> ${props.STATE}</div>` : ''}
                                </div>
                            `);
                            
                            layer.on('mouseover', function() {
                                this.setStyle({fillOpacity: 0.4, weight: 2});
                            });
                            layer.on('mouseout', function() {
                                this.setStyle({fillOpacity: 0.25, weight: 1.5});
                            });
                        }
                    }).addTo(coopLayer);
                    
                    console.log(`✓ Loaded ${data.features.length} cooperative territories`);
                    fileLoaded();
                } else {
                    console.warn('No cooperative features returned');
                    fileLoaded();
                }
            } catch (error) {
                console.error('Error loading cooperative territories:', error);
                fileLoaded();
            }
        }
        
        loadCooperativeTerritories();
        
        // Event listeners for layer toggles
        document.getElementById('coopToggle').addEventListener('change', (e) => {
            e.target.checked ? map.addLayer(coopLayer) : map.removeLayer(coopLayer);
        });

        document.getElementById('burdenToggle').addEventListener('change', (e) => {
            e.target.checked ? map.addLayer(burdenLayer) : map.removeLayer(burdenLayer);
        });

        // Opacity controls
        document.getElementById('coopOpacity').addEventListener('input', (e) => {
            const opacity = parseFloat(e.target.value) / 100;
            document.getElementById('coopOpacityValue').textContent = e.target.value + '%';
            coopLayer.eachLayer(layer => {
                if (layer.setStyle) {
                    layer.setStyle({fillOpacity: opacity});
                }
            });
        });

        document.getElementById('burdenOpacity').addEventListener('input', (e) => {
            const opacity = parseFloat(e.target.value) / 100;
            document.getElementById('burdenOpacityValue').textContent = e.target.value + '%';
            burdenGeoJSON.setStyle({fillOpacity: opacity});
        });
    </script>
</body>
</html>
