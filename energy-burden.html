<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Household Energy Burden Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
        
        .info {
            padding: 10px 14px;
            background: white;
            background: rgba(255,255,255,0.95);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 8px;
            max-width: 280px;
        }
        
        .info h4 {
            margin: 0 0 8px;
            color: #333;
            font-size: 16px;
            font-weight: 600;
        }
        
        .info p {
            margin: 6px 0;
            font-size: 13px;
            color: #666;
        }
        
        .info b {
            color: #333;
        }
        
        .legend {
            padding: 10px 14px;
            background: white;
            background: rgba(255,255,255,0.95);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 8px;
            line-height: 20px;
            color: #555;
        }
        
        .legend h4 {
            margin: 0 0 8px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }
        
        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.8;
            border-radius: 2px;
        }
        
        .legend p {
            margin: 4px 0;
            font-size: 12px;
            clear: both;
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 10000;
            text-align: center;
        }
        
        #loading h3 {
            margin: 0 0 15px 0;
            color: #333;
            font-size: 18px;
        }
        
        #loading .progress {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #f0f0f0;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 15px;
        }
        
        .progress-bar-fill {
            height: 100%;
            background: #3498db;
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h3>Loading Energy Burden Data</h3>
        <div class="spinner"></div>
        <div class="progress">Initializing...</div>
        <div class="progress-bar">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>
    
    <div id="map"></div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map
        const map = L.map('map', {
            center: [39.8283, -98.5795], // Center of US
            zoom: 5,
            minZoom: 4,
            maxZoom: 13
        });
        
        // Add base map
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);
        
        // Color scale for energy burden
        function getColor(burden) {
            return burden > 8.0 ? '#a50f15' :  // Dark red
                   burden > 6.0 ? '#de2d26' :  // Red
                   burden > 4.5 ? '#fb6a4a' :  // Light red
                   burden > 3.8 ? '#fc9272' :  // Pink
                   burden > 3.0 ? '#fcbba1' :  // Light pink
                                  '#fee5d9';   // Very light pink
        }
        
        // Style function
        function style(feature) {
            return {
                fillColor: getColor(feature.properties.energy_burden),
                weight: 0.5,
                opacity: 0.3,
                color: 'white',
                fillOpacity: 0.7
            };
        }
        
        // Highlight feature on hover
        function highlightFeature(e) {
            const layer = e.target;
            layer.setStyle({
                weight: 2,
                color: '#666',
                fillOpacity: 0.9
            });
            layer.bringToFront();
            info.update(layer.feature.properties);
        }
        
        function resetHighlight(e) {
            geojsonLayer.resetStyle(e.target);
            info.update();
        }
        
        // Info control
        const info = L.control();
        
        info.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info');
            this.update();
            return this._div;
        };
        
        info.update = function (props) {
            this._div.innerHTML = '<h4>Household Energy Burden</h4>' +  
                (props ?
                    '<p><b>' + props.state_name + '</b></p>' +
                    '<p>Census Tract: ' + props.GEOID + '</p>' +
                    '<p>Energy Burden: <b>' + props.energy_burden.toFixed(2) + '%</b> of income</p>' +
                    '<p style="font-size:11px;color:#888;margin-top:8px;">Hover over tracts to see details</p>'
                    : '<p>Hover over a census tract</p>');
        };
        
        info.addTo(map);
        
        // Legend
        const legend = L.control({position: 'bottomright'});
        
        legend.onAdd = function (map) {
            const div = L.DomUtil.create('div', 'legend');
            const grades = [0, 3.0, 3.8, 4.5, 6.0, 8.0];
            
            div.innerHTML = '<h4>Energy Burden<br/>% of Income</h4>';
            
            for (let i = 0; i < grades.length; i++) {
                div.innerHTML +=
                    '<p><i style="background:' + getColor(grades[i] + 0.1) + '"></i> ' +
                    grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '%' : '+%') + '</p>';
            }
            
            return div;
        };
        
        legend.addTo(map);
        
        // Global geojsonLayer variable
        let geojsonLayer = L.geoJSON(null, {
            style: style,
            onEachFeature: function(feature, layer) {
                layer.on({
                    mouseover: highlightFeature,
                    mouseout: resetHighlight
                });
            }
        }).addTo(map);
        
        // Load all 3 GeoJSON files
        let loadedFiles = 0;
        const totalFiles = 3;
        
        function updateProgress(message, percentage) {
            document.querySelector('#loading .progress').textContent = message;
            document.getElementById('progressBar').style.width = percentage + '%';
        }
        
        function fileLoaded() {
            loadedFiles++;
            const percentage = (loadedFiles / totalFiles) * 100;
            
            if (loadedFiles === totalFiles) {
                updateProgress('Complete! Loading map...', 100);
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                }, 500);
            }
        }
        
        const baseUrl = 'https://raw.githubusercontent.com/salisbrach/Congress-Coop-Map/refs/heads/main/';
        const westUrl = baseUrl + 'energy_burden_tracts_west.geojson';
        const centralUrl = baseUrl + 'energy_burden_tracts_central.geojson';
        const eastUrl = baseUrl + 'energy_burden_tracts_east.geojson';
        
        // Load Western US
        updateProgress('Loading Western US...', 0);
        fetch(westUrl)
            .then(response => response.json())
            .then(data => {
                geojsonLayer.addData(data);
                updateProgress('Western US loaded', 33);
                fileLoaded();
            })
            .catch(error => {
                console.error('Error loading Western US:', error);
                updateProgress('Error loading Western US data', 0);
            });
        
        // Load Central US
        fetch(centralUrl)
            .then(response => response.json())
            .then(data => {
                geojsonLayer.addData(data);
                updateProgress('Central US loaded', 66);
                fileLoaded();
            })
            .catch(error => {
                console.error('Error loading Central US:', error);
                updateProgress('Error loading Central US data', 33);
            });
        
        // Load Eastern US
        fetch(eastUrl)
            .then(response => response.json())
            .then(data => {
                geojsonLayer.addData(data);
                updateProgress('Eastern US loaded', 100);
                fileLoaded();
            })
            .catch(error => {
                console.error('Error loading Eastern US:', error);
                updateProgress('Error loading Eastern US data', 66);
            });
    </script>
</body>
</html>
