<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Congressional Districts - Electric Cooperatives Coverage</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:Arial,sans-serif; background:#f5f5f5; padding:20px; }

.container {
    max-width:1400px;
    margin:auto;
    background:white;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    overflow:hidden;
}

header {
    background:#00005B;
    color:white;
    padding:30px;
    display:flex;
    align-items:center;
    gap:20px;
}

header img { height:60px; }
header h1 { font-size:28px; margin-bottom:8px; }
header p { font-size:14px; opacity:.9; }

.map-container { padding:20px; }
#map { height:600px; border-radius:8px; border:2px solid #e0e0e0; }

.data-section { padding:20px; border-top:2px solid #e0e0e0; }

.filter-container { margin-bottom:20px; }

table {
    width:100%;
    border-collapse:collapse;
    font-size:14px;
}

th {
    background:#f5f5f5;
    padding:12px;
    text-align:left;
    font-weight:600;
    border-bottom:2px solid #ddd;
    cursor:pointer;
}

td { padding:10px 12px; border-bottom:1px solid #e0e0e0; }
tr:hover { background:#f9f9f9; }

.sortable::after { content:' ⇅'; opacity:.3; }
.sort-asc::after { content:' ↑'; opacity:1; }
.sort-desc::after { content:' ↓'; opacity:1; }

a { color:#6360F0; text-decoration:none; }
a:hover { text-decoration:underline; }

#pagination {
    margin-top:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}

#pagination button {
    padding:6px 12px;
    border:1px solid #ddd;
    background:white;
    border-radius:4px;
    cursor:pointer;
}

#pagination button:disabled {
    background:#00005B;
    color:white;
    cursor:default;
}
</style>
</head>

<body>
<div class="container">

<header>
    <img src="pleiades logo white.png" alt="Logo">
    <div>
        <h1>Congressional Districts Electric Cooperatives Coverage</h1>
        <p>Interactive map showing electric cooperative population coverage</p>
    </div>
</header>

<div class="map-container">
    <div id="map"></div>
</div>

<div class="data-section">

<div class="filter-container">
    <label for="stateFilter"><strong>Filter by State:</strong></label>
    <select id="stateFilter">
        <option value="">All States</option>
    </select>
</div>

<table>
<thead>
<tr>
    <th>District</th>
    <th>Representative</th>
    <th class="sortable" onclick="sortTable('population')">Total Population</th>
    <th class="sortable" onclick="sortTable('coopPopulation')">Co-op Population</th>
    <th class="sortable" onclick="sortTable('percentage')">Coverage %</th>
    <th>NRECA Data</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<div id="pagination">
    <div id="pageInfo"></div>
    <div>
        <button id="prevBtn">Previous</button>
        <button id="nextBtn">Next</button>
    </div>
</div>

</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
/* ------------------ STATE ------------------ */
const rowsPerPage = 25;
let currentPage = 1;
let currentSort = { column:null, direction:'asc' };
let allRows = [];
let filteredRows = [];

/* ------------------ LOAD CSV ------------------ */
Papa.parse('districts.csv', {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: results => {
        allRows = results.data.map(r => ({
            state: r.State,
            district: r['District Number'],
            representative: r.Representative,
            repLink: r['Representative website link'],
            population: parseInt(r['Total Population'].replace(/,/g,'')),
            coopPopulation: parseInt(r['Coop Population'].replace(/,/g,'')),
            percentage: parseFloat(r['Ratio Coop Service'].replace('%','')),
            coopLink: r['Coop info link'],
            populationLabel: r['Total Population'],
            coopLabel: r['Coop Population'],
            percentageLabel: r['Ratio Coop Service']
        }));

        filteredRows = [...allRows];
        populateStateFilter();
        renderTable();
    }
});

/* ------------------ TABLE RENDER ------------------ */
function renderTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    const start = (currentPage - 1) * rowsPerPage;
    const end = Math.min(start + rowsPerPage, filteredRows.length);

    filteredRows.slice(start, end).forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${row.state} - ${row.district}</td>
            <td><a href="${row.repLink}" target="_blank">${row.representative}</a></td>
            <td>${row.populationLabel}</td>
            <td>${row.coopLabel}</td>
            <td>${row.percentageLabel}</td>
            <td><a href="${row.coopLink}" target="_blank">View</a></td>
        `;
        tbody.appendChild(tr);
    });

    updatePagination();
}

/* ------------------ PAGINATION ------------------ */
function updatePagination() {
    const total = filteredRows.length;
    const start = (currentPage - 1) * rowsPerPage + 1;
    const end = Math.min(currentPage * rowsPerPage, total);

    document.getElementById('pageInfo').textContent =
        `Showing ${start}-${end} of ${total} entries`;

    document.getElementById('prevBtn').disabled = currentPage === 1;
    document.getElementById('nextBtn').disabled = currentPage * rowsPerPage >= total;
}

document.getElementById('prevBtn').onclick = () => {
    currentPage--;
    renderTable();
};

document.getElementById('nextBtn').onclick = () => {
    currentPage++;
    renderTable();
};

/* ------------------ SORT ------------------ */
function sortTable(column) {
    if (currentSort.column === column) {
        currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
    } else {
        currentSort.column = column;
        currentSort.direction = 'asc';
    }

    filteredRows.sort((a,b) =>
        currentSort.direction === 'asc'
        ? a[column] - b[column]
        : b[column] - a[column]
    );

    currentPage = 1;
    renderTable();
}

/* ------------------ FILTER ------------------ */
function populateStateFilter() {
    const select = document.getElementById('stateFilter');
    [...new Set(allRows.map(r => r.state))].sort().forEach(state => {
        const opt = document.createElement('option');
        opt.value = state;
        opt.textContent = state;
        select.appendChild(opt);
    });

    select.onchange = () => {
        const value = select.value;
        filteredRows = value
            ? allRows.filter(r => r.state === value)
            : [...allRows];

        currentPage = 1;
        renderTable();
    };
}
</script>
</body>
</html>
